name: CI

# Every push to main redeploys connected projects, so check each change before it lands.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agency
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations apply cleanly
        run: npm run db:migrate
      - name: Lint
        run: npx eslint src
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit
      - name: Tests (unit + database)
        run: npm test
      - name: Tenant isolation (two seeded tenants)
        run: npm run db:seed && npm run db:seed-preview && npm run verify:isolation
      - name: Schema matches the migrations
        run: npx drizzle-kit generate --name ci-check && git diff --exit-code --stat -- drizzle && test -z "$(git status --porcelain drizzle)"
      - name: Build
        run: npm run build

